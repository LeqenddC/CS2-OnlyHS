name: build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/OnlyHS/CS2-OnlyHS.csproj -c Release -o publish/CS2-OnlyHS
      # CounterStrikeSharp.API.dll is never copied (ExcludeAssets="runtime"), so the zip only
      # contains the plugin itself, its deps.json and the lang/ folder.
      - run: rm -f publish/CS2-OnlyHS/*.runtimeconfig.json && cd publish && zip -r ../CS2-OnlyHS.zip CS2-OnlyHS
      - uses: actions/upload-artifact@v4
        with:
          name: CS2-OnlyHS
          path: CS2-OnlyHS.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2-OnlyHS.zip
